type: object
properties:
  id:
    type: number
    description: The ID of the custom filter
  name:
    type: string
    description: The name of the custom filter
  filter_type:
    type: string
    enum: ["conversation", "contact", "report"]
    description: The category of saved filter
  visibility:
    type: string
    enum: ['personal', 'team']
    default: personal
    description: Fixed at creation. Only account administrators can create team conversation filters. All members of the account can read them.
  query:
    type: object
    description: A query that needs to be saved as a custom filter
  created_at:
    type: string
    format: date-time
    description: The time at which the custom filter was created
  updated_at:
    type: string
    format: date-time
    description: The time at which the custom filter was updated

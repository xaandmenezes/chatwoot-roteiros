tags:
  - Custom Filters
operationId: get-details-of-a-single-custom-filter
summary: Get a custom filter details
description: Read a personal filter or a team conversation filter in the current account.
security:
  - userBearerAuth: []
  - userApiKey: []
responses:
  '200':
    description: Success
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/custom_filter'
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '404':
    description: The filter is unavailable to this user in the current account
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'

tags:
  - Custom Filters
operationId: delete-a-custom-filter
summary: Delete a custom filter
security:
  - userBearerAuth: []
  - userApiKey: []
description: Delete your own personal filter or, as an account administrator, a team conversation filter.
responses:
  '204':
    description: Success
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '404':
    description: The custom filter does not exist in the account
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'

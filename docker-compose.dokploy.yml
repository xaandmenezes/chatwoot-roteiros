x-chatwoot: &chatwoot
  image: ghcr.io/xaandmenezes/chatwoot-roteiros:${CHATWOOT_IMAGE_TAG:-prod}
  platform: linux/amd64
  pull_policy: always
  environment: &chatwoot-environment
    RAILS_ENV: production
    NODE_ENV: production
    INSTALLATION_ENV: docker
    SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in Dokploy}
    FRONTEND_URL: ${FRONTEND_URL:?Set the HTTPS Chatwoot URL}
    FORCE_SSL: "true"
    DEFAULT_LOCALE: pt_BR
    ENABLE_ACCOUNT_SIGNUP: "false"
    ACTIVE_STORAGE_SERVICE: local
    RAILS_LOG_TO_STDOUT: "true"
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DATABASE: chatwoot
    POSTGRES_USERNAME: chatwoot
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}
    REDIS_URL: redis://redis:6379
    REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in Dokploy}
  volumes:
    - storage_data:/app/storage

services:
  prepare:
    <<: *chatwoot
    entrypoint: docker/entrypoints/rails.sh
    command: [bundle, exec, rails, db:chatwoot_prepare]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  rails:
    <<: *chatwoot
    environment: &chatwoot-runtime-environment
      <<: *chatwoot-environment
      MAILER_SENDER_EMAIL:
      SMTP_ADDRESS:
      SMTP_PORT:
      SMTP_DOMAIN:
      SMTP_USERNAME:
      SMTP_PASSWORD:
      SMTP_AUTHENTICATION:
      SMTP_ENABLE_STARTTLS_AUTO:
      SMTP_OPENSSL_VERIFY_MODE:
      SMTP_TLS:
      SMTP_SSL:
      UMBLER_LABELS_ACCOUNT_ID: ${UMBLER_LABELS_ACCOUNT_ID:-}
      UMBLER_ORGANIZATION_ID: ${UMBLER_ORGANIZATION_ID:-}
      UMBLER_API_TOKEN: ${UMBLER_API_TOKEN:-}
      RYZE_WEBHOOK_SECRET: ${RYZE_WEBHOOK_SECRET:-}
      RYZE_INSTANCE_NAME: ${RYZE_INSTANCE_NAME:-}
      RYZE_INBOX_ID: ${RYZE_INBOX_ID:-}
      RYZE_PILOT_CHAT_JID: ${RYZE_PILOT_CHAT_JID:-}
      RYZE_EDIT_API_TOKEN: ${RYZE_EDIT_API_TOKEN:-}
      RYZE_EDIT_CONVERSATION_ID: ${RYZE_EDIT_CONVERSATION_ID:-}
      RYZE_NATIVE_BRIDGE_USER_ID: ${RYZE_NATIVE_BRIDGE_USER_ID:-}
      RYZE_REACTIONS_ENABLED: ${RYZE_REACTIONS_ENABLED:-false}
      RYZE_OUTBOUND_PRESENCE_ENABLED: ${RYZE_OUTBOUND_PRESENCE_ENABLED:-false}
      RYZE_PROFILE_AVATAR_SYNC: ${RYZE_PROFILE_AVATAR_SYNC:-false}
      RYZE_GROUPS_INBOX_ENABLED: ${RYZE_GROUPS_INBOX_ENABLED:-false}
      PSR_RESTRICTED_INBOX_ID: ${PSR_RESTRICTED_INBOX_ID:-}
      PSR_RANDOM_ASSIGNMENT_START_AT: ${PSR_RANDOM_ASSIGNMENT_START_AT:-}
      RYZE_DIRECT_INBOX_ENABLED: ${RYZE_DIRECT_INBOX_ENABLED:-false}
      RYZE_AUDIO_TRANSCRIPTION_ENABLED: ${RYZE_AUDIO_TRANSCRIPTION_ENABLED:-false}
      RYZE_AUDIO_TRANSCRIPTION_CONVERSATION_ID: ${RYZE_AUDIO_TRANSCRIPTION_CONVERSATION_ID:-}
      RYZE_HISTORY_SYNC_ENABLED: ${RYZE_HISTORY_SYNC_ENABLED:-true}
      RYZE_HISTORY_BINDING_SECRET: ${RYZE_HISTORY_BINDING_SECRET:-}
    entrypoint: docker/entrypoints/rails.sh
    command: [bundle, exec, rails, s, -p, "3000", -b, 0.0.0.0]
    restart: unless-stopped
    depends_on:
      prepare:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - ruby
        - -rnet/http
        - -e
        - 'request = Net::HTTP::Get.new("/health", {"X-Forwarded-Proto" => "https"}); response = Net::HTTP.start("127.0.0.1", 3000) { |http| http.request(request) }; exit(response.code == "200" && response.body.include?("woot") ? 0 : 1)'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  sidekiq:
    <<: *chatwoot
    environment: *chatwoot-runtime-environment
    command: [bundle, exec, sidekiq, -C, config/sidekiq.yml]
    restart: unless-stopped
    depends_on:
      prepare:
        condition: service_completed_successfully

    networks:
      - default
      - ryze_audio

  ryze-transcriber:
    profiles: [transcription]
    image: ghcr.io/ggml-org/whisper.cpp@sha256:4dfb768b5c2bbdffb327ef4cd9cb49e7e93e15762309c0fdc57c8bf387401deb
    platform: linux/amd64
    entrypoint: [whisper-server]
    command: [--host, 0.0.0.0, --port, "8080", --model, /models/ggml-small-q5_1.bin, --threads, "2", --language, pt, --convert, --tmp-dir, /tmp]
    networks: [ryze_audio]
    volumes:
      - type: bind
        source: ${RYZE_AUDIO_TRANSCRIPTION_FFMPEG_WRAPPER:-./docker/whisper/ffmpeg}
        target: /usr/local/bin/ffmpeg
        read_only: true
        bind:
          create_host_path: false
      - ${RYZE_AUDIO_TRANSCRIPTION_MODEL_DIR:-/var/lib/psr/whisper-models}:/models:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2.0
    mem_limit: 2g
    restart: unless-stopped
    logging:
      driver: "none"
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8080/health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in Dokploy}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  storage_data:
  postgres_data:
  redis_data:

networks:
  ryze_audio:
    internal: true

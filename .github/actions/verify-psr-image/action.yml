name: Verify the PSR image
description: Build and check the PSR image using the registry service on the runner.
inputs:
  revision:
    description: Full SHA of the commit to build and test.
    required: true
outputs:
  image:
    description: Reference by digest in the runner registry.
    value: ${{ steps.build.outputs.image }}
runs:
  using: composite
  steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: ${{ inputs.revision }}
        path: psr-image-source
        persist-credentials: false

    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      with:
        driver-opts: network=host
        buildkitd-config-inline: |
          [registry."127.0.0.1:5000"]
            http = true

    - name: Build and push to the runner's registry
      id: build
      working-directory: psr-image-source
      env:
        REVISION: ${{ inputs.revision }}
        IMAGE_REPO: 127.0.0.1:5000/chatwoot-psr
      shell: bash
      run: |
        test "$(git rev-parse HEAD)" = "$REVISION"
        docker buildx build --platform linux/amd64 --file docker/Dockerfile \
          --label "org.opencontainers.image.revision=$REVISION" \
          --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
          --tag "$IMAGE_REPO:$REVISION" --push --metadata-file "$RUNNER_TEMP/image.json" .
        digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/image.json")
        echo "image=$IMAGE_REPO@$digest" >> "$GITHUB_OUTPUT"

    - name: Pull by digest and check the image
      env:
        PSR_IMAGE: ${{ steps.build.outputs.image }}
        REVISION: ${{ inputs.revision }}
      shell: bash
      run: |
        docker pull --platform linux/amd64 "$PSR_IMAGE"
        test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$PSR_IMAGE")" = linux/amd64
        test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$PSR_IMAGE")" = "$REVISION"
        test "$(docker run --rm --network none "$PSR_IMAGE" cat /app/.git_sha)" = "$REVISION"
        docker run --rm --network none "$PSR_IMAGE" test -s /app/public/vite/.vite/manifest.json

    - name: Prepare a fresh database and boot the pulled image
      working-directory: psr-image-source
      env:
        PSR_IMAGE: ${{ steps.build.outputs.image }}
        REVISION: ${{ inputs.revision }}
        CHATWOOT_IMAGE_TAG: ${{ inputs.revision }}
        FRONTEND_URL: https://chatwoot.invalid
        COMPOSE_FILE: docker-compose.dokploy.yml:${{ github.workspace }}/.github/compose.psr-image.yml
        COMPOSE_PROJECT_NAME: psr-image-test
      shell: bash
      run: |
        SECRET_KEY_BASE=$(openssl rand -hex 64)
        POSTGRES_PASSWORD=$(openssl rand -hex 24)
        REDIS_PASSWORD=$(openssl rand -hex 24)
        export SECRET_KEY_BASE POSTGRES_PASSWORD REDIS_PASSWORD
        trap 'docker compose down --volumes' EXIT
        docker compose pull postgres redis
        docker compose up --no-build --pull never --wait --wait-timeout 240 rails sidekiq || {
          docker compose logs --tail=100 prepare rails sidekiq
          exit 1
        }
        if ! timeout 60s docker compose exec -T redis sh -es <<'REDIS_CHECK'
        export REDISCLI_AUTH="$REDIS_PASSWORD"
        until test "$(redis-cli --raw SCARD processes)" -gt 0; do sleep 2; done
        REDIS_CHECK
        then
          docker compose logs --tail=100 sidekiq
          exit 1
        fi
        image_id=$(docker image inspect --format '{{.Id}}' "$PSR_IMAGE")
        rails=$(docker compose ps -q rails)
        sidekiq=$(docker compose ps -q sidekiq)
        for container in "$rails" "$sidekiq"; do
          test "$(docker inspect --format '{{.Image}}' "$container")" = "$image_id"
        done
        test "$(docker inspect --format '{{.State.Health.Status}}' "$rails")" = healthy
        test "$(docker inspect --format '{{.State.Running}}/{{.RestartCount}}' "$sidekiq")" = true/0
        {
          printf "Verified commit \`%s\` on \`linux/amd64\`.\n\n" "$REVISION"
          printf "Pulled \`%s\` from the runner registry.\n\n" "$PSR_IMAGE"
          echo 'OCI revision, /app/.git_sha, Vite manifest, db:chatwoot_prepare, Rails /health and Sidekiq heartbeat passed.'
        } >> "$GITHUB_STEP_SUMMARY"

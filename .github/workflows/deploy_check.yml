name: Deploy Check
run-name: Dokploy check for PR ${{ github.event.pull_request.number }} at ${{ github.event.pull_request.head.sha }}

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deployment_check:
    name: Check Deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      registry:
        image: registry:3
        ports:
          - 127.0.0.1:5000:5000
    steps:
      # The PR head can predate the shared action used by this workflow.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - uses: ./.github/actions/verify-psr-image
        with:
          revision: ${{ github.event.pull_request.head.sha }}

name: Release PSR image
run-name: Release PSR image at ${{ github.sha }}

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-psr-image-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.repository == 'xaandmenezes/chatwoot-roteiros'
    name: Build and push to GHCR
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      GHCR_IMAGE: ghcr.io/xaandmenezes/chatwoot-roteiros
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set image tags
        id: meta
        shell: bash
        run: |
          tags="${GHCR_IMAGE}:${GITHUB_SHA}"
          if [ "${GITHUB_REF}" = "refs/heads/prod" ]; then
            tags="${tags},${GHCR_IMAGE}:prod"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=psr-linux-amd64
          cache-to: type=gha,mode=max,scope=psr-linux-amd64,ignore-error=true

      - name: Write summary
        shell: bash
        run: |
          {
            printf "Published \`%s\` to GHCR.\n\n" "${{ github.sha }}"
            printf "Tags: \`%s\`\n\n" "${{ steps.meta.outputs.tags }}"
            printf "Digest: \`%s\`\n" "${{ steps.build.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"

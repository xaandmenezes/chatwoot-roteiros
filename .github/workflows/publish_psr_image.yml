name: Publish verified PSR image
run-name: Publish PSR image at ${{ github.sha }}

on:
  push:
    branches: [develop]

permissions: {}

concurrency:
  group: publish-psr-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'xaandmenezes/chatwoot-roteiros' && github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' && !github.event.deleted
    name: Verify and publish to GHCR
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      REVISION: ${{ github.sha }}
      GHCR_IMAGE: ghcr.io/xaandmenezes/chatwoot-roteiros
    services:
      registry:
        image: registry:3
        ports:
          - 127.0.0.1:5000:5000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - uses: ./.github/actions/verify-psr-image
        id: verify
        with:
          revision: ${{ env.REVISION }}

      - name: Install crane
        shell: bash
        run: |
          archive="$RUNNER_TEMP/crane.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0 "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/psr-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/psr-bin" crane
          echo "$RUNNER_TEMP/psr-bin" >> "$GITHUB_PATH"

      - name: Copy the verified manifest and check GHCR by digest
        env:
          GHCR_TOKEN: ${{ github.token }}
          PSR_IMAGE: ${{ steps.verify.outputs.image }}
        shell: bash
        run: |
          digest=${PSR_IMAGE##*@}
          tag="$GHCR_IMAGE:$REVISION"
          published="$GHCR_IMAGE@$digest"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT

          # Copy the entire manifest or OCI index, including attestations.
          if ! crane copy --no-clobber "$PSR_IMAGE" "$tag"; then
            test "$(crane digest "$tag")" = "$digest"
          fi
          test "$(crane digest "$tag")" = "$digest"
          manifest_hash=$(crane manifest "$published" | sha256sum | cut -d ' ' -f 1)
          test "sha256:$manifest_hash" = "$digest"
          docker pull --platform linux/amd64 "$published"
          test "$(docker image inspect --format '{{.Id}}' "$published")" = \
            "$(docker image inspect --format '{{.Id}}' "$PSR_IMAGE")"

          {
            printf "Published commit \`%s\` to GHCR.\n\n" "$REVISION"
            printf "Tag: \`%s\`\n\n" "$tag"
            printf "Verified pull: \`%s\` (linux/amd64)\n" "$published"
          } >> "$GITHUB_STEP_SUMMARY"
